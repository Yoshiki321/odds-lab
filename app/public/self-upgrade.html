<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自我升级 · Odds-Lab</title>
<script>if(/\bembed=/.test(location.search))document.documentElement.classList.add('embed')</script>
<style>
/* 与 index.html 同一套设计令牌（design-taste-frontend skill） */
:root{
  --bg0:#05070d; --bg1:#0a0e17; --bg2:#0e1421; --bg3:#151d30;
  --ln:rgba(145,164,204,.10); --ln2:rgba(145,164,204,.20);
  --t1:#e9edf6; --t2:#a6b0ca; --t3:#7b86a4;
  --acc:#34d399; --acc-strong:#10b981; --acc-ink:#04231a;
  --up:#3fd9a0; --down:#fb7185; --wait:#f6b94a; --info:#74a7f2; --model:#9c8ff0; --cyan:#4fe0c4;
  --sans:-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  --mono:ui-monospace,'Cascadia Mono','SF Mono',Consolas,'Roboto Mono',Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
html{color-scheme:dark;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(145,164,204,.32) transparent}
*{margin:0;padding:0;box-sizing:border-box}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(145,164,204,.22);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(145,164,204,.42);border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-corner{background:transparent}
body{font-family:var(--sans);background:var(--bg0);color:var(--t1);padding:36px 20px 60px;line-height:1.6;font-size:14px;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0 0 auto 0;height:380px;background:radial-gradient(800px 280px at 50% -140px,rgba(156,143,240,.06),transparent 70%);pointer-events:none;z-index:0}
::selection{background:rgba(52,211,153,.28)}
.container{max-width:860px;margin:0 auto;position:relative;z-index:1}
.ic{display:inline-block;vertical-align:-2px}
.head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.head .mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--model);background:linear-gradient(135deg,rgba(156,143,240,.2),rgba(156,143,240,.04));border:1px solid rgba(156,143,240,.32);box-shadow:0 0 18px rgba(156,143,240,.12)}
h1{font-size:21px;font-weight:800;letter-spacing:.01em}
.sub{font-size:13px;color:var(--t3);margin:2px 0 8px}
.back{display:inline-flex;align-items:center;gap:7px;margin:0 0 22px;font-size:12.5px;color:var(--info);text-decoration:none;font-weight:600;border:1px solid var(--ln2);background:var(--bg2);padding:7px 13px;border-radius:8px;transition:all .18s var(--ease)}
.back:hover{color:var(--t1);border-color:var(--ln2);background:var(--bg3)}
.back:active{transform:scale(.97)}
h2{font-size:15px;font-weight:700;margin:30px 0 12px;color:var(--t1);display:flex;align-items:center;gap:9px}
h2 svg{color:var(--model)}
h2 .c{background:var(--bg2);padding:1px 10px;border-radius:999px;font-size:11px;color:var(--t3);margin-left:2px;font-weight:600;font-family:var(--mono)}
.rule{background:var(--bg1);border:1px solid var(--ln);border-radius:10px;padding:13px 16px;margin-bottom:8px;font-size:13px;display:flex;align-items:flex-start;gap:12px;transition:border-color .18s var(--ease)}
.rule:hover{border-color:var(--ln2)}
.rule .id{background:var(--bg0);padding:2px 10px;border-radius:6px;font-size:11px;font-weight:700;color:var(--info);flex-shrink:0;margin-top:1px;font-family:var(--mono);border:1px solid var(--ln)}
.rule .new{background:rgba(156,143,240,.16);color:var(--model);padding:1px 7px;border-radius:999px;font-size:10px;margin-left:8px;font-weight:700}
.mistake{background:var(--bg1);border:1px solid var(--ln);border-radius:10px;padding:13px 16px;margin-bottom:8px;font-size:13px;transition:border-color .18s var(--ease)}
.mistake:hover{border-color:var(--ln2)}
.mistake .top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.mistake .id{font-weight:700;font-size:12px;color:var(--down);font-family:var(--mono)}
.mistake .type{background:rgba(251,113,133,.12);color:var(--down);padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700}
.mistake .new{background:rgba(156,143,240,.16);color:var(--model);padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700}
.mistake .date{color:var(--t3);font-size:11.5px;font-family:var(--mono);margin-left:auto}
.mistake .desc{color:var(--t2)}
.mistake .fix{margin-top:6px;color:var(--up);font-size:12px;display:flex;align-items:flex-start;gap:6px}
.mistake .fix .ic{margin-top:2px;flex:none}
.mistake .count{background:var(--bg0);padding:2px 9px;border-radius:999px;font-size:10.5px;color:var(--wait);font-family:var(--mono);border:1px solid rgba(246,185,74,.3)}
.check-item{display:flex;align-items:center;gap:12px;padding:11px 15px;background:var(--bg1);border:1px solid var(--ln);border-radius:9px;margin-bottom:6px;font-size:13px;transition:border-color .18s var(--ease)}
.check-item:hover{border-color:var(--ln2)}
.check-item .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.check-item .dot.done{background:var(--up);box-shadow:0 0 8px rgba(63,217,160,.5)}
.check-item .dot.new{background:var(--model);box-shadow:0 0 8px rgba(156,143,240,.5)}
.check-item .dot.stage{background:var(--info)}
.check-item .stage-label{font-size:10.5px;color:var(--cyan);background:var(--bg0);padding:2px 9px;border-radius:999px;margin-right:2px;font-weight:700;border:1px solid var(--ln)}
.check-item .new{background:rgba(156,143,240,.16);color:var(--model);padding:1px 7px;border-radius:999px;font-size:10px;margin-left:8px;font-weight:700}
/* ===== 日记（2026-09-06 并入本页） ===== */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:52px 20px;text-align:center;color:var(--t3);font-size:13px}
.di-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:14px}
.cal{background:var(--bg1);border:1px solid var(--ln);border-radius:12px;padding:16px;height:fit-content}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-header .ym{font-size:14px;font-weight:700;letter-spacing:.02em}
.cal-header .nav{display:flex;gap:8px}
.cal-header button{background:var(--bg0);border:1px solid var(--ln2);color:var(--t3);border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;transition:all .15s var(--ease)}
.cal-header button:hover{color:var(--t1);border-color:var(--ln2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid .dow{font-size:10px;color:var(--t3);text-align:center;padding:5px 0;font-family:var(--mono)}
.cal-grid .day{min-height:34px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;position:relative;transition:all .15s var(--ease);border:1px solid transparent;padding:3px 0;font-family:var(--mono)}
.cal-grid .day.empty{cursor:default}
.cal-grid .day:hover:not(.empty){background:var(--bg3)}
.cal-grid .day.has{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.22)}
.cal-grid .day.on{background:var(--acc);color:var(--acc-ink);font-weight:700;box-shadow:0 2px 10px rgba(52,211,153,.25)}
.cal-grid .day.on .dot,.cal-grid .day.on .dot.g,.cal-grid .day.on .dot.r,.cal-grid .day.on .dot.y{background:var(--acc-ink)}
.cal-grid .day .dot{width:4px;height:4px;border-radius:50%;margin-top:3px}
.cal-grid .day .dot.g{background:var(--up)}.cal-grid .day .dot.r{background:var(--down)}.cal-grid .day .dot.y{background:var(--wait)}
.diary{padding:4px 0 14px;min-width:0}
.diary-head{display:flex;align-items:center;gap:18px;margin-bottom:8px}
.diary-head .date-big{font-size:44px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em;line-height:1;color:var(--t1)}
.diary-head .date-sub{color:var(--t3);font-size:13px;padding-top:7px;line-height:1.7}
.diary-title{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px}
.diary-title::before{content:'';width:3px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--acc),var(--cyan));flex:none}
.entry{position:relative;padding:0 0 22px 28px;border-left:1px solid var(--ln2)}
.entry:last-child{border-left-color:transparent;padding-bottom:6px}
.entry::before{content:'';position:absolute;left:-5.5px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--bg1);border:2px solid var(--t3)}
.entry[data-type="mistake"]::before{border-color:var(--down);background:var(--down);box-shadow:0 0 8px rgba(251,113,133,.5)}
.entry[data-type="lesson"]::before{border-color:var(--wait);background:var(--wait)}
.entry[data-type="action"]::before{border-color:var(--up);background:var(--up)}
.entry[data-type="analysis"]::before{border-color:var(--info);background:var(--info)}
.entry[data-type="thought"]::before{border-color:var(--cyan);background:var(--cyan)}
.entry .time{font-size:11px;color:var(--t3);font-weight:600;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:9px}
.entry .content{font-size:13.5px;line-height:1.8;color:var(--t2);white-space:pre-line;overflow-wrap:break-word;word-break:break-word}
.entry .content b{color:var(--t1)}
.entry .content em{font-style:normal;color:var(--wait)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.tag.thought{background:rgba(79,224,196,.12);color:var(--cyan)}
.tag.mistake{background:rgba(251,113,133,.13);color:var(--down)}
.tag.lesson{background:rgba(246,185,74,.13);color:var(--wait)}
.tag.action{background:rgba(63,217,160,.13);color:var(--up)}
.tag.analysis{background:rgba(156,143,240,.13);color:var(--model)}
.tag.settle{background:rgba(116,167,242,.13);color:var(--info)}
.tag.decision{background:rgba(52,211,153,.13);color:var(--acc)}
.tag.summary{background:rgba(246,185,74,.13);color:var(--wait)}
.tag.correction{background:rgba(52,211,153,.13);color:var(--acc)}
.day-bets{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:20px}
.day-bet{background:var(--bg1);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:12.5px;min-width:0}
.day-bet .b-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.day-bet .b-id{font-weight:700;font-size:12.5px;font-family:var(--mono);color:var(--t1)}
.day-bet .b-status{font-size:10.5px;padding:2px 9px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.day-bet .b-status.win{background:rgba(63,217,160,.14);color:var(--up)}
.day-bet .b-status.lose{background:rgba(251,113,133,.14);color:var(--down)}
.day-bet .b-status.active{background:rgba(246,185,74,.14);color:var(--wait)}
.day-bet .b-status.void{background:rgba(255,255,255,.07);color:var(--t3)}
.b-legs{color:var(--t3);line-height:1.7}
.b-legs b{color:var(--cyan)}
.b-odd{margin-top:9px;color:var(--t1);font-weight:600;font-family:var(--mono);font-size:12px}
@media(max-width:820px){.di-grid{grid-template-columns:1fr}}
/* 复盘区块 */
.postmortem{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid rgba(246,185,74,.35);border-radius:14px;padding:20px 22px;margin-bottom:14px}
.postmortem h3{font-size:14px;font-weight:700;margin-bottom:16px;color:var(--wait);display:flex;align-items:center;gap:9px}
.postmortem h3 .num{width:22px;height:22px;border-radius:7px;background:rgba(246,185,74,.14);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--wait)}
.pm-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--ln)}
.pm-item:last-child{border-bottom:none}
.pm-item .icon{flex-shrink:0;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;background:var(--bg0);border:1px solid var(--ln)}
.pm-item .icon .ic{color:var(--down)}
.pm-item .icon.ok .ic{color:var(--up)}
.pm-item .icon.link .ic{color:var(--info)}
.pm-item .body{flex:1;min-width:0}
.pm-item .title{font-size:13px;font-weight:600;margin-bottom:3px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pm-item .detail{font-size:12.5px;color:var(--t3)}
.pm-item .tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.04em}
.tag-r{background:rgba(251,113,133,.13);color:var(--down)}
.tag-g{background:rgba(63,217,160,.13);color:var(--up)}
.tag-b{background:rgba(116,167,242,.13);color:var(--info)}
.footer{text-align:center;padding:28px 0 0;font-size:12px;color:var(--t3);border-top:1px solid var(--ln);margin-top:36px}
.footer a{color:var(--info);text-decoration:none}
html.embed body{padding:4px 8px 16px}
html.embed body::before,.embed .back,.embed .footer,.embed .head{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="container">
<a class="back" href="/"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>返回看板</a>
<div class="head">
  <div class="mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4"/><path d="M12 2v6.5L19 19a2 2 0 0 1-1.7 3H6.7A2 2 0 0 1 5 19l7-10.5V2"/><path d="M7.5 15h9"/></svg></div>
  <div>
    <h1>自我升级 · 日记</h1>
    <div class="sub">自 09-05 评分纪元起，自我升级并入日记：复盘逐日进日记，规则与错误账在此汇总</div>
  </div>
</div>
<div id="app"></div>
<div class="footer"><a href="/">返回看板</a></div>
</div>
<script>
const ICON = {
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  light:'<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 2 1 3h6c0-1 .2-2.2 1-3A6 6 0 0 0 12 3z"/>',
  flag:'<path d="M5 21V4"/><path d="M5 4c5-2 8 2 14 0v10c-6 2-9-2-14 0"/>',
  chart:'<path d="M4 20h16"/><path d="M6 16v-4"/><path d="M11 16V7"/><path d="M16 16v-7"/><path d="M21 16v-9"/>'
};
const icon = n => `<svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ''}</svg>`;
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<b>$1</b>');
const TTL = { lesson:'心得', mistake:'教训', settle:'结算', decision:'决策', analysis:'分析', summary:'汇总', action:'行动' };
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
/* ===== 日记（2026-09-06 与自我提升合并为单页，禁止整页重渲、只刷日历+当日面板） ===== */
const D = { journals: [], y: 2026, m: 9, cur: '' };
const DI_TXT = { thought:'思考', mistake:'教训', lesson:'心得', action:'行动', analysis:'分析', settle:'结算', summary:'汇总', decision:'决策', correction:'修正' };
function calOffset(d){ D.m += d; if(D.m < 1){ D.m = 12; D.y--; } if(D.m > 12){ D.m = 1; D.y++; } renderCal(); }
function calDay(ds){
  const j = D.journals.find(x => x.date === ds);
  if (j) { D.cur = ds; renderCal(); renderDiary(); return; }
  const prev = [...D.journals].reverse().find(x => x.date < ds);
  const next = D.journals.find(x => x.date > ds);
  const t = prev || next;
  if (t) { D.cur = t.date; renderCal(); renderDiary(); alert('该日无日记，已跳至 ' + t.date); }
}
function renderCal(){
  const ym = document.getElementById('cal-ym'), grid = document.getElementById('cal-grid');
  if (!ym || !grid) return;
  ym.textContent = `${D.y}年 ${D.m}月`;
  const first = new Date(D.y, D.m - 1, 1).getDay();
  const days = new Date(D.y, D.m, 0).getDate();
  const dow = ['日','一','二','三','四','五','六'];
  let h = dow.map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < first; i++) h += '<div class="day empty"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${D.y}-${String(D.m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const j = D.journals.find(x => x.date === ds);
    const dot = j ? (j.bankroll && j.bankroll.change > 0 ? 'g' : j.bankroll && j.bankroll.change < 0 ? 'r' : 'y') : '';
    h += `<div class="day${j ? ' has' : ''}${D.cur === ds ? ' on' : ''}" onclick="calDay('${ds}')">${d}${dot ? `<div class="dot ${dot}"></div>` : ''}</div>`;
  }
  grid.innerHTML = h;
}
function renderDiary(){
  const el = document.getElementById('diary');
  if (!el) return;
  const j = D.journals.find(x => x.date === D.cur) || D.journals[D.journals.length - 1];
  if (!j) { el.innerHTML = '<div class="empty">还没有日记</div>'; return; }
  D.cur = j.date;
  renderCal();
  let bets = '';
  if (j.bets && j.bets.length) {
    bets = `<div class="day-bets">${j.bets.map(b => {
      const st = b.status === 'loss' ? 'lose' : b.status === 'win' ? 'win' : b.status === 'void' ? 'void' : 'active';
      const stTxt = b.status === 'loss' ? '输' : b.status === 'win' ? '赢' : b.status === 'void' ? '无效' : '在途';
      const ret = b.return != null ? ` → ${r2(b.return)}` : '';
      const profit = b.return != null ? r2(b.return - b.stake) : null;
      return `<div class="day-bet"><div class="b-head"><span class="b-id">bet #${esc(b.id)}</span><span class="b-status ${st}">${stTxt}</span></div><div class="b-legs">${esc(b.legs || '')}</div><div class="b-odd">投 ${r2(b.stake)} 元${ret}${profit != null ? ` · 盈亏 ${profit >= 0 ? '+' : ''}${profit}` : ''}</div></div>`;
    }).join('')}</div>`;
  }
  let content = '';
  (j.content || []).forEach(e => {
    content += `<div class="entry" data-type="${e.type}"><div class="time"><span class="tag ${e.type}">${DI_TXT[e.type] || e.type}</span> · ${esc(e.time)}</div><div class="content">${md(e.text)}</div></div>`;
  });
  el.innerHTML = `<div class="diary-head">
    <div class="date-big">${j.date.slice(5)}</div>
    <div class="date-sub">${esc(j.date)}<br>盈亏 ${j.bankroll && j.bankroll.change >= 0 ? '+' : ''}${r2(((j.bankroll || {}).change) || 0)} 元<br>${esc(j.mood || '')}</div>
  </div>
  <div class="diary-title">${esc(j.title)}</div>
  ${bets}${content}`;
}
async function main(){
  let data = { rules:[], mistakes:[], upgrades:[], checklist:[] };
  try{const r=await fetch('/api/mistakes');if(r.ok){const j=await r.json();if(j)data={...data,...j}}}catch{}
  let journals=[];
  try{const r=await fetch('/api/diary');if(r.ok){const j=await r.json();journals=(j.journals||[]).sort((a,b)=>a.date<b.date?1:-1);}}catch{}
  D.journals = journals.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  D.cur = D.journals[D.journals.length - 1]?.date || '';
  if (D.cur) { D.y = +D.cur.slice(0, 4); D.m = +D.cur.slice(5, 7); }
  let h='';

  // 投注日记（并入本页最上，日历 + 当日面板）
  h += `<h2>投注日记 <span class="c">${D.journals.length} 篇</span></h2>
    <div class="di-grid">
      <div class="cal"><div class="cal-header"><div class="ym" id="cal-ym"></div><div class="nav">
        <button onclick="calOffset(-1)" type="button" aria-label="上月"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></button>
        <button onclick="calOffset(1)" type="button" aria-label="下月"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg></button>
      </div></div><div class="cal-grid" id="cal-grid"></div></div>
      <div class="diary" id="diary"></div>
    </div>`;

  // 复盘时间线 ← 逐日日记（自我升级已并入日记）
  const pm=[];
  for(const j of journals){ for(const e of (j.content||[])){
    if(['lesson','mistake','settle','decision'].includes(e.type)) pm.push({date:j.date,time:e.time,type:e.type,text:e.text});
  }}
  h+=`<h2>日记复盘 <span class="c">${pm.length} 条</span> <span style="font-size:11px;color:var(--t3);font-weight:400">结算/教训/决策逐日进日记，此处滚动汇总</span></h2>`;
  if(pm.length){
    h+=`<div class="postmortem">${pm.slice(0,14).map(e=>`
      <div class="pm-item">
        <div class="icon"><span class="ic">${icon(e.type==='mistake'?'x':e.type==='decision'?'flag':'light')}</span></div>
        <div class="body">
          <div class="title">${e.date} ${esc(e.time||'')} <span class="tag ${e.type==='mistake'?'tag-r':e.type==='lesson'?'tag-g':'tag-b'}">${TTL[e.type]||e.type}</span></div>
          <div class="detail">${md(e.text)}</div>
        </div>
      </div>`).join('')}</div>`;
  } else {
    h+=`<div class="postmortem"><div class="pm-item"><div class="icon ok"><span class="ic">${icon('check')}</span></div><div class="body"><div class="title">评分纪元（09-05）开启：暂无复盘</div><div class="detail">从今起每次结算、每条教训自动写入当日日记，这里随日记滚动。</div></div></div></div>`;
  }

  // 版本历史（评分机制）
  h+=`<h2>评分机制版本 <span class="c">${(data.upgrades||[]).length} 次</span></h2>`;
  (data.upgrades||[]).forEach(u=>{
    h+=`<div class="rule"><span class="id">${u.from}→${u.to}</span><span>${u.date} · ${u.what}<br><span style="color:var(--t3);font-size:12px">依据：${u.why}</span></span></div>`;
  });

  // rules
  h+=`<h2>系统规则 <span class="c">${data.rules.length} 条</span></h2>`;
  (data.rules||[]).forEach(r=>{
    h+=`<div class="rule"><span class="id">${r.id}</span><span>${r.text}</span></div>`;
  });
  // mistakes
  h+=`<h2>已记录错误 <span class="c">${data.mistakes.length} 条</span></h2>`;
  (data.mistakes||[]).forEach(m=>{
    h+=`<div class="mistake">
      <div class="top"><span class="id">${m.id}</span><span class="type">${m.type}</span><span class="date">${m.date}</span>${m.count>0?`<span class="count">复发 ${m.count}次</span>`:''}</div>
      <div class="desc">${m.desc}</div>
      <div class="fix">${icon('check')}<span>${m.fix}</span></div>
    </div>`;
  });
  // checklist
  h+=`<h2>投前核查清单 <span class="c">${data.checklist.length} 项</span></h2>`;
  (data.checklist||[]).forEach(c=>{
    const dotClass = c.isNew ? 'new' : (c.stage === '资金' || c.stage === '投后' ? 'done' : 'stage');
    h+=`<div class="check-item"><span class="dot ${dotClass}"></span><span class="stage-label">${c.stage}</span><span>${c.item}</span></div>`;
  });
  document.getElementById('app').innerHTML=h;
  renderCal();
  renderDiary();
}
main()
</script>
</body>
</html>
